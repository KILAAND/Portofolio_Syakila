  <main class="syakila_container">
    <h2 class="syakila_section_title">Hubungi Saya</h2>
    <p class="syakila_subtitle">Silakan kirim pesan atau pertanyaan melalui formulir di bawah ini.</p>

    <form id="syakila_form_kontak">
      <div class="syakila_form_group">
        <label for="syakila_input_nama">Nama Lengkap</label>
        <input type="text" id="syakila_input_nama" placeholder="Masukkan nama Anda" required>
      </div>
      <div class="syakila_form_group">
        <label for="syakila_input_email">Alamat Email</label>
        <input type="email" id="syakila_input_email" placeholder="nama@email.com" required>
      </div>
      <div class="syakila_form_group">
        <label for="syakila_input_pesan">Pesan</label>
        <textarea id="syakila_input_pesan" rows="5" placeholder="Tulis pesan Anda di sini..." required></textarea>
      </div>
      <button type="submit" class="syakila_btn">Kirim Pesan</button>
      <p id="syakila_form_status"></p>
    </form>
  </main>
